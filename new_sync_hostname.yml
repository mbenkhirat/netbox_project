# .github/workflows/sync_hostname.yml
#
# Pipeline multi-stage pour un playbook qui MODIFIE un device réel
# (contrairement au backup/audit qui sont en lecture seule).
#
# Stages : lint -> test (dry-run/--check) -> apply (approbation manuelle)

name: Sync Hostname (NetBox -> FortiGate)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Device à cibler (ou "all" pour tout l inventaire)'
        required: true
        default: 'all'

jobs:

  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up venv and install deps
        run: |
          python3.12 -m venv netbox-fortigate-venv
          source netbox-fortigate-venv/bin/activate
          pip install ansible ansible-lint --break-system-packages

      - name: Run ansible-lint
        run: |
          source netbox-fortigate-venv/bin/activate
          ansible-lint sync_hostname_playbook.yml

      - name: Run yamllint on inventory
        run: |
          source netbox-fortigate-venv/bin/activate
          pip install yamllint --break-system-packages
          yamllint netbox_inventory.yml

  test:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dry-run (--check mode, aucune modification réelle)
        run: |
          source netbox-fortigate-venv/bin/activate
          ansible-playbook sync_hostname_playbook.yml \
            -i netbox_inventory.yml \
            --vault-password-file .vault_pass \
            --check --diff \
            ${{ github.event.inputs.target_device != 'all' && format('--limit {0}', github.event.inputs.target_device) || '' }}
        # --check simule l'exécution sans toucher au device
        # --diff affiche précisément ce qui changerait (utile pour la revue humaine)

  apply:
    runs-on: self-hosted
    needs: test
    environment: production-firewalls   # <-- déclenche l'approbation manuelle
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply hostname sync (real change)
        run: |
          source netbox-fortigate-venv/bin/activate
          ansible-playbook sync_hostname_playbook.yml \
            -i netbox_inventory.yml \
            --vault-password-file .vault_pass \
            ${{ github.event.inputs.target_device != 'all' && format('--limit {0}', github.event.inputs.target_device) || '' }}

      - name: Upload sync report
        uses: actions/upload-artifact@v4
        with:
          name: sync-hostname-report-${{ github.run_id }}
          path: reports/sync_hostname/*
          retention-days: 90