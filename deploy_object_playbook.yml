---
- name: Garde-fous (avant toute connexion)
  hosts: localhost
  gather_facts: false
  vars_files: [vars/address_objects.yml]
  tasks:
    - name: Le périmètre lab doit exister et ne pas être vide
      ansible.builtin.assert:
        that:
          - groups['tags_lab'] | default([]) | length > 0
          - address_objects | default([]) | length > 0
          - object_state in ['present', 'absent']
        fail_msg: "Cible lab absente ou variables manquantes"

- name: Déploiement des objets d'adresse
  hosts: tags_lab
  gather_facts: false
  vars_files: [vars/address_objects.yml]
  # connexion / token : mêmes variables que backup_playbook.yml (group_vars + vault)
  tasks:
    - name: Snapshot avant changement
      fortinet.fortios.fortios_configuration_fact:
        vdom: root
        selector: firewall_address
      register: before

    - name: Sauvegarder le snapshot (artefact du workflow)
      ansible.builtin.copy:
        content: "{{ before.meta.results | to_nice_json }}"
        dest: "deploy_reports/{{ inventory_hostname }}_before.json"
        mode: "0640"
      delegate_to: localhost
      when: not ansible_check_mode

    - name: Appliquer les objets
      fortinet.fortios.fortios_firewall_address:
        vdom: root
        state: "{{ object_state }}"
        firewall_address:
          name: "{{ item.name }}"
          type: ipmask
          subnet: "{{ item.subnet }}"
          comment: "{{ item.comment | default('') }}"
      loop: "{{ address_objects }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Lecture de vérification
      fortinet.fortios.fortios_configuration_fact:
        vdom: root
        selector: firewall_address
        params: { name: "{{ item.name }}" }
      loop: "{{ address_objects }}"
      loop_control: { label: "{{ item.name }}" }
      register: after
      failed_when: >
        (object_state == 'present' and after.meta.results | default([]) | length == 0) or
        (object_state == 'absent' and after.meta.results | default([]) | length > 0)
      when: not ansible_check_mode