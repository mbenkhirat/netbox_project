name: FortiGate Hostname Sync (NetBox-driven)

on:
  workflow_dispatch: {}

jobs:
  sync-hostname:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install/update Python dependencies
        run: |
          source ~/ansible-projects/venv/bin/activate
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: |
          source ~/ansible-projects/venv/bin/activate
          ansible-galaxy collection install -r requirements.yml

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run sync-hostname playbook
        run: |
          source ~/ansible-projects/venv/bin/activate
          ansible-playbook -i netbox_inventory.yml new_sync_hostname_playbook.yml --vault-password-file .vault_pass

      - name: Cleanup vault password
        if: always()
        run: rm -f .vault_pass

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-hostname-report-${{ github.run_number }}
          path: backup_reports/sync_hostname/
          retention-days: 90